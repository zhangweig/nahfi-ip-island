name: 问题反馈
description: 提交可复现的功能或显示问题
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: 岛仔版本
      placeholder: v0.6.39
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统与显示环境
      placeholder: Windows 11，125% 缩放，单显示器
  - type: textarea
    id: reproduction
    attributes:
      label: 操作步骤、实际结果与预期结果
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: 截图或脱敏日志
      description: 请遮挡邮箱、验证码和私人日程；不要上传密码、Cookie、登录 JSON 或数据目录。
